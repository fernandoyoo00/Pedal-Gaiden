plugins { id 'application' }
dependencies {
    implementation project(':core')
    implementation 'com.badlogicgames.gdx:gdx-backend-lwjgl3:1.13.5'
    runtimeOnly 'com.badlogicgames.gdx:gdx-platform:1.13.5:natives-desktop'
}
application { mainClass = 'com.pedalgaiden.desktop.DesktopLauncher' }
tasks.named('run', JavaExec) {
    workingDir = rootProject.file('assets')
    if (System.getProperty('os.name').toLowerCase().contains('mac')) jvmArgs '-XstartOnFirstThread'
}
